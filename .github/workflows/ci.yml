---
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install tools
        id: install
        run: cd tools && npm ci
      - name: Tests
        run: cd tools && npm test
      # Audits the committed lockfile, dev dependencies included (everything here is dev tooling),
      # so a new high or critical advisory fails CI without waiting for Dependabot.
      - name: Audit tools
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: cd tools && npm audit --audit-level=high
      - name: Clean build
        run: OWNER_FIRST_NAME=Test CONTACT_EMAIL=test@example.com node build.mjs
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Site tools (the consumer test runs the page's status.js in jsdom)
        run: cd tools && npm ci
      - name: Install worker
        id: install
        run: cd worker && npm ci
      - name: Worker tests
        run: cd worker && npm test
      # Full tree on purpose: wrangler is a dev dependency and holds the Cloudflare login.
      - name: Audit worker
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: cd worker && npm audit --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks image is digest-pinned inside run:, which Dependabot doesn't update (its docker
      # ecosystem only reads Dockerfiles and compose files). Bump the tag and digest by hand.
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          git . --redact --no-banner
